name: CI

on:
  push:
    branches: [main]
  # Every pull request, whatever it targets: a PR stacked on another PR's
  # branch is reviewed and merged on its own checks too.
  pull_request:

# Pull request runs share one group per PR, so a newer push to the PR cancels
# the run it supersedes. Push runs get a group per commit: a push to main never
# waits behind, cancels or is cancelled by another, so every commit on main
# gets its own verdict.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build
        run: make build

      - name: Every e2e suite is in the e2e matrix
        run: make check-e2e-matrix

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Lint
        run: make lint

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Test
        run: make test

  test-e2e:
    name: Test E2E (${{ matrix.suite }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        suite:
          - TestIntegrationTestSuite
          - TestLivenessIntegrationTestSuite
          - TestMultiValidatorIntegrationTestSuite
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Run E2E Tests
        run: make test-e2e-suite SUITE=${{ matrix.suite }}

  # Branch protection requires one check named "Test E2E"; the matrix above
  # reports one per suite. This job carries their combined result under that
  # name, and runs even when a suite fails so that a failure is reported
  # rather than a skip.
  test-e2e-result:
    name: Test E2E
    runs-on: ubuntu-latest
    needs: test-e2e
    if: always()
    steps:
      - name: Every suite passed
        run: test "${{ needs.test-e2e.result }}" = success
